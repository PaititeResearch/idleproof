name: qualification-timeout-export
on:
  push:
    branches: ['qualification/openrouter-timeout-export-20261021']
    paths: ['.github/workflows/qualification-timeout-export.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ad342c0905ffab3e6ba1f77828b1c3f81981bc17
          persist-credentials: false
      - name: Archive the exact candidate without credentials or helper files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = ad342c0905ffab3e6ba1f77828b1c3f81981bc17
          test "$(git rev-parse HEAD^{tree})" = 5c55bb999d9e9606b069010d3a0906a460d6cff4
          mkdir "$RUNNER_TEMP/timeout-export"
          git archive --format=tar HEAD > "$RUNNER_TEMP/timeout-export/idleproof-v8.tar"
          git cat-file commit HEAD > "$RUNNER_TEMP/timeout-export/commit.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/timeout-export/tree.txt"
          cd "$RUNNER_TEMP/timeout-export"
          sha256sum idleproof-v8.tar commit.txt tree.txt > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: idleproof-v8-exact-source-timeout
          path: ${{ runner.temp }}/timeout-export/
          if-no-files-found: error
          retention-days: 7

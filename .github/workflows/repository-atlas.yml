name: repository-atlas-experimental
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repository-atlas-${{ github.ref }}
  cancel-in-progress: true
jobs:
  atlas-real-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: PaititeResearch/diffwitness
          ref: 7f043a3cbaf1b2c3e59d48bc6509a1ae627f8a23
          path: producer-core
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Install exact Core outside the target fixture
        run: python -m pip install './producer-core[structure]'
      - name: Real capture, source identity, editing isolation and safety
        env:
          IDLEPROOF_TEST_CORE: '1'
        run: node --test --test-concurrency=1 test/atlas*.test.mjs
  atlas-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Install isolated pinned browser driver
        run: |
          npm install --prefix "$RUNNER_TEMP/atlas-browser" --no-save --package-lock=false --ignore-scripts playwright@1.63.0
          node "$RUNNER_TEMP/atlas-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Real canvas, local editing, history, sources, exports and mobile
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/atlas-browser/node_modules/playwright/index.mjs
          ATLAS_RECIPE_OUT: ${{ github.workspace }}/qualification-evidence/atlas
        run: node scripts/atlas-browser-recipe.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: repository-atlas-browser
          path: qualification-evidence/atlas/
          if-no-files-found: error

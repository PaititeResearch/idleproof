name: qualification-plain-export
on:
  push:
    branches: ['qualification/openrouter-plain-export-20261021']
    paths: ['.github/workflows/qualification-plain-export.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f27fb34f04823b955994a124739e0ee9520438f3
          persist-credentials: false
      - name: Archive the exact v9 candidate without helper files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = f27fb34f04823b955994a124739e0ee9520438f3
          test "$(git rev-parse HEAD^{tree})" = 908bb2d4644bce20b4c560df6ebd5f405779bb97
          mkdir "$RUNNER_TEMP/plain-export"
          git archive --format=tar HEAD > "$RUNNER_TEMP/plain-export/idleproof-v9.tar"
          git cat-file commit HEAD > "$RUNNER_TEMP/plain-export/commit.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/plain-export/tree.txt"
          cd "$RUNNER_TEMP/plain-export"
          sha256sum idleproof-v9.tar commit.txt tree.txt > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: idleproof-v9-exact-source-plain
          path: ${{ runner.temp }}/plain-export/
          if-no-files-found: error
          retention-days: 7

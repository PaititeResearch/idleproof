name: project-understanding
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: project-understanding-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core-local-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: PaititeResearch/diffwitness
          ref: 7f043a3cbaf1b2c3e59d48bc6509a1ae627f8a23
          path: producer-core
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install explicit qualification dependencies
        run: python -m pip install './producer-core[structure]'
      - name: Real captured source and memory contracts
        env:
          IDLEPROOF_TEST_CORE: '1'
        run: node --test --test-concurrency=1 test/project-scan.test.mjs test/project-corpus.test.mjs test/project-navigation.test.mjs
      - name: Golden local contracts with actual Core
        run: |
          mkdir -p qualification-evidence
          node scripts/golden-contract.mjs --scope local --core producer-core --report qualification-evidence/golden.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: golden-local-contract
          path: qualification-evidence/
          if-no-files-found: error
  local-ui-browser:
    # MACHINE qualification of the Local page in Chromium: real server, real hook path, network
    # faults injected at the browser layer only. Not a HUMAN acceptance.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install pinned browser driver
        run: |
          npm install --prefix "$RUNNER_TEMP/local-ui-browser" --no-save --package-lock=false playwright@1.63.0
          node "$RUNNER_TEMP/local-ui-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Connection, actions, information, semantics, layout and accessibility in Chromium
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/local-ui-browser/node_modules/playwright/index.mjs
          RECIPE_OUT: ${{ github.workspace }}/qualification-evidence/local-ui
        run: node scripts/local-ui-browser-recipe.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: local-ui-browser
          path: qualification-evidence/local-ui/
          if-no-files-found: error
